name: Build and deploy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test deployment behavior (no cloud calls)
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Upload bundle for deployment
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: scf-bundle
          path: dist/bundle.js
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: scf-ap-guangzhou-iirose-media-web
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependencies
        run: python -m pip install --requirement scripts/requirements-scf.txt

      - name: Download built bundle
        uses: actions/download-artifact@v4
        with:
          name: scf-bundle
          path: dist

      - name: Deploy to Tencent Cloud SCF
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          SCF_NAMESPACE: ${{ vars.SCF_NAMESPACE }}
        run: python scripts/deploy_scf.py --bundle dist/bundle.js
